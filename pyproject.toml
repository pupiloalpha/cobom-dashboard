[project]
name = "cobom-dashboard"
version = "0.2.0"
description = "Dashboard interativo de analise operacional do COBOM-BH / CBMMG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.3.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.17.0",
    "openpyxl>=3.1.2",
    "chardet>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
